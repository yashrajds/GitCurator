[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitcurator"
version = "0.1.0"
description = "Autonomous AI GitHub Profile & Repository Manager"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
    "rich>=13.7.1",
    "pydantic>=2.7.0"
]

[project.scripts]
gitcurator = "gitcurator.cli:main"
